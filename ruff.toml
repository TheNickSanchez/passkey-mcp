target-version = "py310"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (readability tradeoff)
]

[lint.per-file-ignores]
"passkey/claude.py" = ["F401"]   # re-exports for backward compat
"passkey/claude_commands.py" = ["F401"]  # re-exports for backward compat
"tests/*" = ["B"]  # relax bugbear in tests

[format]
quote-style = "double"
indent-style = "space"
