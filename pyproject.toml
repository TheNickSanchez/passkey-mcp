[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passkey-mcp"
version = "1.1.0"
description = "Cross-platform secrets manager for MCP servers and CLI tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nick Sanchez", email = "nick@example.com"}
]
keywords = ["keychain", "secrets", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "keyring>=24.0.0",
    "pyperclip>=1.8.0",
    "mcp>=1.0.0",
    "questionary>=2.0.0",
    "cryptography>=41.0.0",
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
passkey = "passkey.cli:main"
passkey-mcp-server = "passkey.mcp_server:main"

[project.urls]
Homepage = "https://github.com/TheNickSanchez/passkey-mcp"
Changelog = "https://github.com/TheNickSanchez/passkey-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real Keychain access",
]
